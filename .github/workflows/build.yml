name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.4'
        
    - name: Generate Keystore
      run: |
        rm -f app/release.jks
        keytool -genkey -v -keystore app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias upwell-key -dname "cn=ScreenTranslator, ou=App, o=ScreenTranslator, c=RU" -storepass upwellclick -keypass upwellclick
        
    - name: Build Release APK with Gradle
      run: gradle assembleRelease
      
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: error
        
    - name: Upload Signing Keystore
      uses: actions/upload-artifact@v4
      with:
        name: ScreenTranslator-Keystore
        path: app/release.jks
